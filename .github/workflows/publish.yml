name: Publish to NuGet

on:
  push:
    tags:
      - 'v*' # Triggers on version tags (e.g. v1.0.0)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Solution
      run: dotnet build --configuration Release --no-restore

    - name: Run Tests
      run: |
        dotnet test tests/OutboxCore.Tests.Unit/OutboxCore.Tests.Unit.csproj --no-build --configuration Release --verbosity normal
        dotnet test tests/OutboxCore.Tests.Integration/OutboxCore.Tests.Integration.csproj --no-build --configuration Release --verbosity normal
        dotnet test tests/OutboxCore.Tests.E2e/OutboxCore.Tests.E2e.csproj --no-build --configuration Release --verbosity normal

    - name: Pack NuGet Packages
      run: dotnet pack --configuration Release --no-build --output ./dist

    - name: Push to NuGet
      run: dotnet nuget push "./dist/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
